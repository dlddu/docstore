# 운영 overlay. Flux(flux-cd-apps/cluster/docstore.yaml 의 docstore-app)가 `deploy`
# 브랜치에서 이 경로를 적용한다. Namespace 객체는 flux-cd-apps 쪽이 소유하므로 여기엔 없다.
# 운영 전용 차이만 둔다 — 이미지 pull secret·Sablier 처럼 클러스터 사정에 묶인 것은
# flux-cd-apps 의 patches 에 있다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: docstore
resources:
  - ../../base
  - pvc.yaml
patches:
  # base 의 emptyDir seam 을 운영 PVC 로 바꾼다.
  - target:
      kind: Deployment
      name: docstore
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: docstore-data
